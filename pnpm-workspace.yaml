# Packages whose install/build scripts pnpm is allowed to run (blocked by default).
# Pre-approved for the stack we're building so installs (incl. Vercel) don't abort.
allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  protobufjs: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - protobufjs
